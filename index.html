<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asep Store | Profesional RGB Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Reset & Font Modern --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* --- RGB Dynamic Gradient (Latar Belakang) --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            background: linear-gradient(-45deg, rgb(255, 0, 0), rgb(0, 255, 0), rgb(0, 0, 255));
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            overflow-x: hidden; /* Mencegah scroll horizontal karena iklan */
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Kartu Profesional --- */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 10;
        }

        /* --- Teks Judul RGB Dinamis --- */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: transparent;
            background: linear-gradient(90deg, #f00, #0f0, #00f);
            -webkit-background-clip: text;
            background-clip: text;
            background-size: 200% auto;
            animation: text-gradient 3s linear infinite;
        }

        @keyframes text-gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        h2 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Konten Profesional --- */
        .info {
            text-align: left;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
        }

        .info strong { color: #333; }

        /* --- Tombol dengan Aksen RGB --- */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            text-decoration: none;
            color: #fff;
            background: #2c3e50;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s ease;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>ASEP STORE</h1>
        <h2>Digital Solutions</h2>

        <div class="info">
            <p><strong>Tentang Kami:</strong> Kami menyediakan solusi digital profesional, mulai dari pengembangan website hingga strategi konten yang dinamis.</p>
            <br>
            <p><strong>Layanan Utama:</strong></p>
            <p>• Website Development</p>
            <p>• UI/UX Design</p>
            <p>• Digital Marketing</p>
        </div>

        <a href="#" class="btn">Hubungi Kami</a>
    </div>

    <script src="https://pl29498318.effectivecpmnetwork.com/a3/8f/60/a38f6056c69d3f3ecc30935ec4aa7ff7.js"></script>

</body>
</html>
