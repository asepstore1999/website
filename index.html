<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asep Store | Profesional RGB Solutions</title>
    <style>
        /* --- Reset & Font Modern --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif; /* Perlu font Google, tapi ini fallback */
        }

        /* --- RGB Dynamic Gradient (Latar Belakang) --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            /* Gradien RGB murni yang mengalir lembut */
            background: linear-gradient(-45deg, rgb(255, 0, 0), rgb(0, 255, 0), rgb(0, 0, 255));
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Kartu Profesional --- */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        /* --- Teks Judul RGB Dinamis --- */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: transparent;
            /* Gradien RGB dinamis pada teks */
            background: linear-gradient(90deg, #f00, #0f0, #00f);
            -webkit-background-clip: text;
            background-clip: text;
            animation: text-gradient 5s linear infinite;
        }

        @keyframes text-gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h2 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Konten Profesional --- */
        .info {
            text-align: left;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
        }

        .info strong { color: #333; }

        /* --- Tombol dengan Aksen RGB --- */
        .btn {
            display: inline-block;
            padding: 10px 25px;
            text-decoration: none;
            color: #fff;
            background: #2c3e50;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s ease;
            position: relative;
            z-index: 1;
        }

        /* Efek perbatasan RGB saat hover */
        .btn::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(90deg, #f00, #0f0, #00f);
            border-radius: 25px;
            z-index: -1;
            filter: blur(5px);
            opacity: 0;
            transition: 0.3s ease;
        }

        .btn:hover { background: #1a252f; transform: translateY(-3px); }
        .btn:hover::after { opacity: 1; }

    </style>
</head>
<body>
    <div class="container">
        <h1>ASEP STORE</h1>
        <h2>Digital Solutions</h2>
        
        <div class="info">
            <p><strong>Tentang Kami:</strong> Kami menyediakan solusi digital profesional, mulai dari pengembangan website hingga strategi konten yang dinamis.</p>
            <br>
            <p><strong>Layanan Utama:</strong></p>
            <p>• Website Development</p>
            <p>• UI/UX Design</p>
            <p>• Digital Marketing</p>
        </div>

        <a href="https://asepstore1999.github.io/website/" class="btn">Lihat Portofolio</a>
    </div>
</body>
</html>
