
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Termux Asep</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 80%;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; line-height: 1.6; }
        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 15px;
            background: #27ae60;
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo Dunia! 🚀</h1>
        <p>Website ini berhasil dijalankan langsung dari HP Android menggunakan <strong>Termux</strong> tanpa akses root.</p>
        <div class="status">Server: Online</div>
    </div>
</body>
</html>
